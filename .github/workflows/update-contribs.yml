name: update contributions
on:
  schedule:
    - cron: "20 20 * * *"   # UTC 20:20 = 北京时间凌晨 4:20，排在贪吃蛇之后
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: regenerate merged-PR table
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OWNER: ${{ github.repository_owner }}
        run: python3 scripts/update_prs.py
      - name: commit if changed
        run: |
          if git diff --exit-code README.md >/dev/null; then
            echo "no changes"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add README.md
            git commit -m "[skip ci] 自动更新开源贡献表"
            git push
          fi
